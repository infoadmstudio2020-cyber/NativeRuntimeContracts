
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release AAR
        run: |
          set -e

          if ./gradlew :native-runtime-contracts:assembleRelease --stacktrace; then
            echo "Native Runtime Contracts AAR build completed."
          else
            echo "Module-specific build failed. Checking available release tasks..."
            if ./gradlew tasks --all 2>/dev/null | grep -qE '(^|[[:space:]])assembleRelease([[:space:]]|$)'; then
              ./gradlew assembleRelease --stacktrace
            else
              ./gradlew build --stacktrace
            fi
          fi

      - name: Verify AAR artifacts
        id: verify-aar
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release-artifacts
          find . -type f -path '*/build/outputs/aar/*.aar' \
            -not -path './release-artifacts/*' \
            -exec cp -f {} release-artifacts/ \;

          if ! compgen -G 'release-artifacts/*.aar' > /dev/null; then
            echo "::error::No AAR artifacts found. Release cannot continue."
            exit 1
          fi

          echo "AAR artifacts ready for release:"
          ls -lh release-artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          files: release-artifacts/*.aar
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
